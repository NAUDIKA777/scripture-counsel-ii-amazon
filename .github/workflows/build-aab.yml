name: Build Google Play AAB

# Builds a signed release AAB (Android App Bundle) ready for Google Play submission.
#
# Trigger:
#   - Push to main
#   - Manual dispatch (Actions tab → "Run workflow")
#   - Tag matching v* → also attaches the AAB to a GitHub Release
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_B64                — base64 of your release (upload) keystore file
#   ANDROID_KEYSTORE_PASSWORD           — keystore password
#   ANDROID_KEY_ALIAS                   — key alias inside the keystore
#   ANDROID_KEY_PASSWORD                — key password
#   REVENUECAT_GOOGLE_PUBLIC_KEY        — goog_... (mirrors frontend/.env)
#
# The keystore must be the same file on every run: Google Play rejects updates
# signed with a different upload key.
#
# Encode the keystore to base64 (macOS/Linux):
#   base64 -i release.keystore | pbcopy        # macOS
#   base64 -w0 release.keystore | xclip -sel   # Linux

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # ---- Write env & secret files --------------------------------------
      - name: Write frontend/.env
        working-directory: frontend
        run: |
          {
            echo "REACT_APP_BACKEND_URL=${{ vars.REACT_APP_BACKEND_URL || 'https://scripture-counsel-2.preview.emergentagent.com' }}"
            echo "WDS_SOCKET_PORT=443"
            echo "ENABLE_HEALTH_CHECK=false"
            echo "REACT_APP_FREE_COUNSEL_LIMIT=1"
            echo "REACT_APP_REVENUECAT_GOOGLE_PUBLIC_KEY=${{ secrets.REVENUECAT_GOOGLE_PUBLIC_KEY }}"
          } > .env

      - name: Restore Android keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 secret missing"
            exit 1
          fi
          # Normalise the secret: drop all whitespace and quotes, any "data:...;base64,"
          # prefix, map URL-safe chars (-_) to standard (+/), restore missing "=" padding.
          KS_CLEAN=$(printf '%s' "$KS_B64" | tr -d "[:space:]\"'" | tr -- '-_' '+/')
          KS_CLEAN="${KS_CLEAN#data:*base64,}"
          while [ $(( ${#KS_CLEAN} % 4 )) -ne 0 ]; do KS_CLEAN="${KS_CLEAN}="; done
          if ! printf '%s' "$KS_CLEAN" | base64 --decode > frontend/android/app/release.keystore; then
            # Diagnostics only — never print the secret itself.
            BAD=$(printf '%s' "$KS_CLEAN" | tr -d 'A-Za-z0-9+/=' | fold -w1 | sort -u | tr -d '\n')
            echo "::error::ANDROID_KEYSTORE_B64 is not valid base64 (length ${#KS_CLEAN}, invalid chars: '${BAD:-none}'). Re-encode with 'base64 -w0 your.keystore' and paste the output as the secret."
            exit 1
          fi
          if [ ! -s frontend/android/app/release.keystore ]; then
            echo "::error::Decoded keystore is empty — re-encode with 'base64 -w0' and update ANDROID_KEYSTORE_B64"
            exit 1
          fi
          ls -l frontend/android/app/release.keystore

      # ---- Build web bundle & sync into android/ -------------------------
      - name: Install web deps
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build web
        working-directory: frontend
        run: yarn build

      - name: Capacitor sync
        working-directory: frontend
        run: npx cap sync android

      # ---- Build ----------------------------------------------------------
      # app/build.gradle already declares the release signingConfig; it reads
      # the WW_* variables below (keystore path is relative to the app module).
      # Without them Gradle emits an unsigned bundle, which Google Play rejects.
      - name: Build release AAB
        working-directory: frontend/android
        env:
          WW_KEYSTORE_FILE: release.keystore
          WW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          WW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          WW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean bundleRelease --stacktrace

      - name: Rename AAB
        id: rename
        run: |
          echo "--- AAB files produced by the build ---"
          find frontend/android/app/build/outputs -name "*.aab" -exec ls -lh {} \; 2>/dev/null || true
          AAB_PATH="frontend/android/app/build/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "::error::No release AAB found at $AAB_PATH"
            exit 1
          fi
          AAB_DIR=$(dirname "$AAB_PATH")
          VERSION=$(grep versionName frontend/android/app/build.gradle | head -1 | awk -F'"' '{print $2}')
          COMMIT_SHORT=$(git rev-parse --short HEAD)
          NAME="wisdomandword-play-v${VERSION}-${COMMIT_SHORT}.aab"
          mv "$AAB_PATH" "$AAB_DIR/$NAME"
          ls -lh "$AAB_DIR"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "path=$AAB_DIR/$NAME" >> "$GITHUB_OUTPUT"

      # ---- Publish -------------------------------------------------------
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: wisdomandword-play-aab
          path: ${{ steps.rename.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Attach AAB to Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.rename.outputs.path }}
          fail_on_unmatched_files: true
          generate_release_notes: true
