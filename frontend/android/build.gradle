// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.2'

        // NOTE: the Google Services / Firebase plugin is intentionally absent;
        // Google Play Billing via RevenueCat does not need it.
        // Do not place your application dependencies here; they belong in the
        // individual module build.gradle files.
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
