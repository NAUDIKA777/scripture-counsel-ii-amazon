// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // Single Kotlin version for every module. @revenuecat/purchases-capacitor
    // compiles with Kotlin 2.2.x, and @capacitor/android reads this value too.
    ext.kotlin_version = '2.2.20'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // AGP 8.13's bundled D8/R8 can parse Kotlin 2.2 metadata; 8.7.x cannot.
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: the Google Services / Firebase plugin is intentionally absent;
        // Google Play Billing via RevenueCat does not need it.
        // Do not place your application dependencies here; they belong in the
        // individual module build.gradle files.
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
